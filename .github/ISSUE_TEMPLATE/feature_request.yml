name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: Briefly explain the feature you would like.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What difficulty or limitation does this feature address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Explain how the feature could work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you considered another approach?
